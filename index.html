<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Совместный просмотр VK Video</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://vk.com/js/api/videoplayer.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🎬 Совместный просмотр VK Video</h1>
            <div class="room-controls">
                <input type="text" id="nickname" placeholder="Ваш ник" maxlength="15">
                <input type="text" id="roomId" placeholder="Название комнаты" value="default-room">
                <button id="joinBtn">Войти</button>
            </div>
            <p id="status" class="status">Введите ник и комнату, затем нажмите «Войти»</p>
        </header>

        <div id="videoSetup" class="video-setup" style="display: none;">
            <div class="input-group">
                <input type="text" id="videoInput" placeholder="Вставьте ссылку на видео ВК или iframe-код">
                <button id="setVideoBtn">Включить видео</button>
            </div>
        </div>

        <main class="main-layout">
            <div class="player-section">
                <div class="player-container">
                    <p class="placeholder">Ожидание видео...</p>
                    <!-- Панель управления для зрителей -->
                    <div id="viewerControls" class="viewer-controls" style="display: none;">
                        <button id="volDownBtn" class="ctrl-btn">🔉 -</button>
                        <button id="volUpBtn" class="ctrl-btn">🔊 +</button>
                        <button id="fsBtn" class="ctrl-btn">⛶ Фулскрин</button>
                    </div>
                </div>
                
                <div class="sync-info">
                    <span id="roleBadge" class="badge">👤 Зритель</span>
                    <button id="becomeLeaderBtn" class="leader-btn" style="display:none;">Стать ведущим</button>
                    <span id="syncStatus" class="sync-status">Синхронизация: ожидание...</span>
                </div>
            </div>

            <div class="users-section">
                <h3>Участники (<span id="userCount">0</span>)</h3>
                <ul id="usersList" class="users-list"></ul>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
